name: Weekly Hakim recommendation

# Same DST-safe gate as survivor-lms: GitHub Actions cron is UTC-only, so two
# cron lines cover both DST states and a `gate` job checks the *real*
# America/New_York wall clock before doing any work. Whichever cron line
# doesn't match shows as "skipped" (not "failed") in the Actions UI.
on:
  schedule:
    - cron: '0 13 * * 3'   # 09:00 America/New_York while EDT is active (UTC-4)
    - cron: '0 14 * * 3'   # 09:00 America/New_York while EST is active (UTC-5)
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week (blank = auto-detect the current week)"
        required: false
      mode:
        description: "main or consolation"
        required: false
        default: consolation

permissions:
  contents: write   # needed to push the gh-pages branch

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=America/New_York date +%H)"
          echo "Wall-clock America/New_York hour: $hour"
          if [ "$hour" = "09" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No ssh-key here: actions/checkout applies it to the WHOLE checkout,
        # including this main repo -- but SURVIVOR_CORE_DEPLOY_KEY is only
        # authorized (read-only) on survivor-core, so that fails with
        # "Repository not found." Main repo uses the default token over
        # HTTPS as normal; the submodule gets its own SSH-agent step below.

      - name: Load survivor-core deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SURVIVOR_CORE_DEPLOY_KEY }}

      - name: Fetch survivor-core submodule
        run: git submodule update --init --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Generate site data
        run: >
          python export_site_data.py
          ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }}
          --mode ${{ github.event.inputs.mode || 'consolation' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Write recommendation to step summary
        run: cat site/data/recommendation.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recommendation as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: hakim-recommendation
          path: outputs/
          retention-days: 90

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
